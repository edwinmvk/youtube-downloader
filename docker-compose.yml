services:
  bgutil-provider:
    image: brainicism/bgutil-ytdlp-pot-provider:2.0.0
    restart: unless-stopped
    networks:
      - backend_net

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-500}
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-2}
      DOWNLOAD_JOB_TTL_SECONDS: ${DOWNLOAD_JOB_TTL_SECONDS:-1800}
      POT_PROVIDER_URL: ${POT_PROVIDER_URL:-http://bgutil-provider:4416}
    depends_on:
      - bgutil-provider
    expose:
      - "5000"
    networks:
      - proxy_net
      - backend_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    expose:
      - "3000"
    networks:
      - proxy_net

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - proxy_net

networks:
  proxy_net:
    driver: bridge
  backend_net:
    driver: bridge
